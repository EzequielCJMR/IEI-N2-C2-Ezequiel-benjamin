<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Encuestado</title>
    <style>
        body { font-family: Arial; background-color: #ecf0f1; color: #333; text-align: center; padding-top: 50px; }
        h1 { color: #27ae60; }
        .card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0px 0px 15px rgba(0,0,0,0.1); display: inline-block; }
        .btn-encuesta { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .logout { display: inline-block; margin-top: 20px; color: #e74c3c; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Portal del Encuestado</h1>
        <p>Bienvenido/a, <strong>{{ nombre }}</strong></p>
        <p>Aquí podrás ver y responder las encuestas disponibles.</p>
        <button class="btn-encuesta">Ver Encuestas Disponibles</button>
    </div>
    <br>
    <a href="/logout" class="logout">Cerrar Sesión</a>
</body>
</html>
